[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-databridge"
version = "0.1.0"
description = "Production-ready MCP server for AI agents to interact with the Titanic database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nader", email = "nader@example.com" },
]
dependencies = [
    "mcp[cli]>=1.26.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
mcp-databridge = "mcp_databridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_databridge"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
